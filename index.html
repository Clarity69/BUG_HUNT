<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Data Mahasiswa</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
        }
        textarea{
            resize: none;
        }
        button {
            padding: 10px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .submit { background: green; color: white; }
        .reset { background: orange; color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .action-btn{
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        /* img {
            cursor: pointer;
        } */
        .view-button{
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
    </style>
</head>
<body>

<h2>Form Data Mahasiswa</h2>

<form id="formMahasiswa">
    <label>NIM</label>
    <input type="text" id="nim" required>

    <label>Nama</label>
    <input type="text" id="nama" required>

    <label>Alamat</label>
    <textarea id="alamat"></textarea>

    <label>Jenis Kelamin</label><br>
    <input type="radio" name="jk" value="Pria"> Pria
    <input type="radio" name="jk" value="Wanita"> Wanita
    <input type="radio" name="jk" value="Lainnya"> Lainnya
    <br><br>

    <label>Tanggal Lahir</label>
    <input type="date" id="tl">

    <label>Password</label>
    <input type="password" id="password">

    <button type="submit" class="submit">Submit</button>
    <button type="reset" class="reset">Reset</button>
</form>

<h2>Data Mahasiswa</h2>

<table>
    <thead>
        <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>JK</th>
            <th>TL</th>
            <th>Password</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    const form = document.getElementById("formMahasiswa");
    const tableBody = document.getElementById("tableBody");
    const STORAGE_KEY = "data_mhs";

    loadData();

    function saveToLocal(){
        localStorage.setItem(STORAGE_KEY, tableBody.innerHTML);
    }

    function loadData(){
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) tableBody.innerHTML = saved;
    }

    function toggleView(btn) {
            const container = btn.parentElement;
            const textSpan = container.querySelector('.pw-text');
            const isOpened = textSpan.getAttribute('data-opened') === 'true';
            const originalPw = textSpan.getAttribute('data-pw');

            if (isOpened) {
                textSpan.innerText = "••••••••";
                textSpan.setAttribute('data-opened', 'false');
                btn.innerText = "👁️";
            } else {
                textSpan.innerText = originalPw;
                textSpan.setAttribute('data-opened', 'true');
                btn.innerText = "🔒";
            }
        }

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const nim = document.getElementById("nim").value;
        const nama = document.getElementById("nama").value;
        const alamat = document.getElementById("alamat").value;
        const jk = document.querySelector('input[name="jk"]:checked')?.value || "-";
        const tl = document.getElementById("tl").value;
        const password = document.getElementById("password").value;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${nim}</td>
            <td>${nama}</td>
            <td>${alamat}</td>
            <td>${jk}</td>
            <td>${tl}</td>
            <td>
                <div class="pw-container">
                    <span class="pw-text" data-opened="false" data-pw="${password}">••••••••</span>
                    <button type="button" class="view-btn" onclick="toggleView(this)"><img src="eye.png" width="20"></button>
                </div>
            </td>
            <td>
                <button class="action-btn" onclick="editRow(this)">
                    <img src="edit.png" width="20">
                </button>
                <button class="action-btn" onclick="deleteRow(this)">
                    <img src="trash.png" width="20">
                </button>
            </td>
        `;

        tableBody.appendChild(row);
        saveToLocal();
        form.reset();
    });

    function deleteRow(el) {
        el.parentElement.parentElement.remove();
        saveToLocal();
        const row = el.closest('tr');
        
        if(confirm("Apakah Anda yakin ingin menghapus data ini?")){
            row.remove();
            saveToLocal();
        }
    }

    function editRow(el) {
    const row = el.closest('tr');
    const cells = row.children;

    document.getElementById("nim").value = cells[0].innerText;
    document.getElementById("nama").value = cells[1].innerText;
    document.getElementById("alamat").value = cells[2].innerText;
    
    const jkValue = cells[3].innerText;
    const radio = document.querySelector(`input[name="jk"][value="${jkValue}"]`);
    if (radio) radio.checked = true;

    document.getElementById("tl").value = cells[4].innerText;
    
    // Cari span di dalam kolom ke-6 (index 5)
    const pwSpan = cells[5].querySelector('.pw-text');
    document.getElementById("password").value = pwSpan.getAttribute('data-pw');

    row.remove();
    saveToLocal();
}
</script>

</body>
</html>
